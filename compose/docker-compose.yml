services:
  # 1. Application Layer (Spring Boot 3.5 + Java 21 JRE connected to AWS RDS)
  backend:
    image: ${BACKEND_IMAGE:-team262-backend:local}
    container_name: moviematch_backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: ${MYSQL_HOST:?Set MYSQL_HOST (RDS endpoint) in .env}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      ROOM_MAX_PARTICIPANTS: ${ROOM_MAX_PARTICIPANTS:-5}
      TMDB_BASE_URL: ${TMDB_BASE_URL:-https://api.themoviedb.org/3}
      TMDB_API_KEY: ${TMDB_API_KEY:?Set TMDB_API_KEY in .env}
    deploy:
      resources:
        limits:
          memory: 700M
    networks:
      - app-network

  # 2. Presentation Layer (React + Vite Static Nginx)
  frontend:
    image: ${FRONTEND_IMAGE:-team262-frontend:local}
    container_name: moviematch_frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - app-network

  # 3. Edge Gateway / Reverse Proxy (Single Entry Point on Port 80)
  gateway:
    image: nginx:1.27-alpine
    container_name: moviematch_gateway
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/gateway-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - app-network

networks:
  app-network:
    driver: bridge