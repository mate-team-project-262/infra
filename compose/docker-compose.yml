services:
  # 1. Local Database Layer (Only starts when explicitly called via '--profile local')
  mysql:
    image: mysql:8.0
    container_name: moviematch_mysql
    profiles: ["local"]
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --performance_schema=OFF
      --innodb_buffer_pool_size=64M
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-moviematch}
      MYSQL_USER: ${MYSQL_USER:-moviematch_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
    ports:
      # Exposed locally for DB client tools (DBeaver, DataGrip)
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-local_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - app-network

  # 2. Application Layer (Spring Boot 3.5)
  backend:
    image: ${BACKEND_IMAGE:-team262-backend:local}
    container_name: moviematch_backend
    restart: unless-stopped
    environment:
      # Defaults to 'mysql' container name for local profile, or reads AWS RDS host from .env
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-moviematch}
      MYSQL_USER: ${MYSQL_USER:-moviematch_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      ROOM_MAX_PARTICIPANTS: ${ROOM_MAX_PARTICIPANTS:-5}
      TITLE_SOURCE: ${TITLE_SOURCE:-stub}
      TMDB_BASE_URL: ${TMDB_BASE_URL:-https://api.themoviedb.org/3}
      TMDB_API_KEY: ${TMDB_API_KEY:-placeholder_api_key}
    deploy:
      resources:
        limits:
          memory: 700M
    networks:
      - app-network

  # 3. Presentation Layer (React + Vite)
  frontend:
    image: ${FRONTEND_IMAGE:-team262-frontend:local}
    container_name: moviematch_frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - app-network

  # 4. Edge Gateway (Nginx Reverse Proxy)
  gateway:
    image: nginx:1.27-alpine
    container_name: moviematch_gateway
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/gateway-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - app-network

volumes:
  mysql_data:
    driver: local

networks:
  app-network:
    driver: bridge