services:
  # 1. Database Layer (Optimized for 1GB RAM AWS EC2)
  mysql:
    image: mysql:8.0
    container_name: moviematch_mysql
    restart: unless-stopped
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --performance_schema=OFF
      --innodb_buffer_pool_size=64M
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - app-network

  # 2. Application Layer (Spring Boot 3.5 + Java 21 JRE)
  backend:
    image: ${BACKEND_IMAGE:-team262-backend:local}
    container_name: moviematch_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 450M
    networks:
      - app-network

  # 3. Presentation Layer (React + Vite Static Nginx)
  frontend:
    image: ${FRONTEND_IMAGE:-team262-frontend:local}
    container_name: moviematch_frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - app-network

  # 4. Edge Gateway / Reverse Proxy (Single Entry Point on Port 80)
  gateway:
    image: nginx:1.27-alpine
    container_name: moviematch_gateway
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - app-network

volumes:
  mysql_data:
    driver: local

networks:
  app-network:
    driver: bridge