# 1. HTTP Server (Port 80) — Local Healthcheck & HTTPS Redirect
server {
    listen 80;
    server_name what2watch.duckdns.org _;

    server_tokens off;

    # 1. Healthcheck endpoint for monitoring (T2-21)
    location = /gateway-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "Gateway OK\n";
    }

    # 2. Redirect all other HTTP traffic to HTTPS (T2-124)
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server (Port 443) — TLS Termination & Reverse Proxy
server {
    listen 443 ssl;
    http2 on;
    server_name what2watch.duckdns.org;

    server_tokens off;

    # Let's Encrypt TLS Certificates (mounted from host in read-only mode)
    ssl_certificate /etc/letsencrypt/live/what2watch.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/what2watch.duckdns.org/privkey.pem;

    # Modern TLS Protocols & Cipher Suites (T2-124 Scope)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 1. Healthcheck endpoint over HTTPS (for external uptime monitors)
    location = /gateway-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "Gateway OK\n";
    }

    # 2. Route all /api/* requests to Spring Boot Backend container
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;

        # Headers for client IP forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;

        # WebSocket support (for Waiting Room real-time sync)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 3. Route Swagger UI / OpenAPI docs to Backend (helpful for QA & Frontend)
    location /swagger-ui/ {
        proxy_pass http://backend:8080/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Route everything else to React Frontend container
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}