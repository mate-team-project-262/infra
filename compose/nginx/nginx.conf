# Strict write limit applies ONLY to POST requests; GET requests evaluate to "" (bypassed)
map $request_method $room_write_limit_key {
    default "";
    POST    $binary_remote_addr;
}

# 1. Strict zone for room creation & join (POST /api/rooms, POST /api/rooms/*/join): 10 req/min + burst 5
limit_req_zone $room_write_limit_key zone=api_room_write:10m rate=10r/m;

# 2. High-throughput zone for general API & 3-second polling: 10 req/sec + burst 30
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;

# 1. HTTP Server (Port 80) — Local Healthcheck & HTTPS Redirect
server {
    listen 80;
    server_name what2watch.duckdns.org _;

    server_tokens off;

    # 1. Healthcheck endpoint for monitoring (T2-21)
    location = /gateway-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "Gateway OK\n";
    }

    # 2. Redirect all other HTTP traffic to HTTPS (T2-124)
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server (Port 443) — TLS Termination & Reverse Proxy
server {
    listen 443 ssl;
    http2 on;
    server_name what2watch.duckdns.org;

    server_tokens off;

    # Return 429 Too Many Requests (instead of default 503) with custom JSON contract (T2-190)
    limit_req_status 429;
    error_page 429 = @rate_limited;

    # Let's Encrypt TLS Certificates (mounted from host in read-only mode)
    ssl_certificate /etc/letsencrypt/live/what2watch.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/what2watch.duckdns.org/privkey.pem;

    # Modern TLS Protocols & Cipher Suites (T2-124 Scope)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers (T2-124 & T2-190 Hardening)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https://image.tmdb.org data: blob: https://www.google-analytics.com https://www.googletagmanager.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com;" always;

    # Custom JSON error response for rate-limited requests matching Backend ErrorResponse
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 10 always;
        add_header Cache-Control "no-store" always;
        return 429 '{"code":"TOO_MANY_REQUESTS","message":"Rate limit exceeded. Please wait a moment and try again.","fieldErrors":{}}\n';
    }

    # 1. Healthcheck endpoint over HTTPS (for external uptime monitors)
    location = /gateway-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "Gateway OK\n";
    }

    # 2. Block public internet access to Spring Boot Actuator endpoints (Security by Default)
    # Actuator is scraped exclusively over the internal AWS VPC private network.
    location ~ ^/(api/)?actuator(/.*)?$ {
        access_log off;
        default_type application/json;
        return 403 '{"code":"FORBIDDEN","message":"Actuator endpoints are restricted to internal VPC network.","fieldErrors":{}}\n';
    }

    # 3. Strict rate-limiting for Room Creation (POST /api/rooms) & Join (POST /api/rooms/{code}/join)
    location ~ ^/api/rooms(/([^/]+/join)?)?$ {
        limit_req zone=api_room_write burst=5 nodelay;
        limit_req zone=api_general burst=30 nodelay;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 4. Route all other /api/* requests to Spring Boot Backend container (high-throughput polling zone)
    location /api/ {
        limit_req zone=api_general burst=30 nodelay;

        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;

        # Hardened proxy headers & client IP forwarding
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;

        # WebSocket support (for Waiting Room real-time sync)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 5. Route Swagger UI / OpenAPI docs to Backend (helpful for QA & Frontend)
    location /swagger-ui/ {
        limit_req zone=api_general burst=30 nodelay;

        proxy_pass http://backend:8080/swagger-ui/;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        limit_req zone=api_general burst=30 nodelay;

        proxy_pass http://backend:8080/v3/api-docs;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. Route everything else to React Frontend container
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}